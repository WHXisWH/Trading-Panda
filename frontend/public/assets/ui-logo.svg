<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Panda face -->
  <circle cx="16" cy="16" r="14" fill="#111827"/>
  <!-- White face patch -->
  <ellipse cx="16" cy="17" rx="9" ry="8" fill="#f8f9fa"/>
  <!-- Eyes -->
  <ellipse cx="12" cy="14" rx="3" ry="3.5" fill="#111827"/>
  <ellipse cx="20" cy="14" rx="3" ry="3.5" fill="#111827"/>
  <!-- Eye highlights -->
  <circle cx="13" cy="13" r="1.2" fill="white"/>
  <circle cx="21" cy="13" r="1.2" fill="white"/>
  <!-- Nose -->
  <ellipse cx="16" cy="18" rx="2" ry="1.5" fill="#111827"/>
  <!-- Mouth -->
  <path d="M14 20.5 Q16 22.5 18 20.5" stroke="#111827" strokeWidth="0.8" fill="none"/>
  <!-- Ears -->
  <circle cx="7" cy="8" r="4" fill="#111827"/>
  <circle cx="25" cy="8" r="4" fill="#111827"/>
</svg>
