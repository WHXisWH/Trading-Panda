<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- ears -->
  <circle cx="15" cy="16" r="9" fill="#111827"/>
  <circle cx="49" cy="16" r="9" fill="#111827"/>
  <circle cx="15" cy="16" r="4" fill="#283243"/>
  <circle cx="49" cy="16" r="4" fill="#283243"/>

  <!-- head -->
  <circle cx="32" cy="34" r="23" fill="#111827"/>

  <!-- forehead energy spark (brand) -->
  <path d="M32 13.5 L33.5 18 L38 19.5 L33.5 21 L32 25.5 L30.5 21 L26 19.5 L30.5 18 Z" fill="#0f973d"/>

  <!-- white face mask -->
  <ellipse cx="32" cy="37.5" rx="16.5" ry="14.5" fill="#f8f9fa"/>

  <!-- eye patches (angled = focused / cool) -->
  <ellipse cx="24" cy="34" rx="5.4" ry="7.3" fill="#111827" transform="rotate(-20 24 34)"/>
  <ellipse cx="40" cy="34" rx="5.4" ry="7.3" fill="#111827" transform="rotate(20 40 34)"/>

  <!-- eyes + green glow -->
  <circle cx="25" cy="33" r="2.5" fill="#f8f9fa"/>
  <circle cx="39" cy="33" r="2.5" fill="#f8f9fa"/>
  <circle cx="25" cy="33" r="1.5" fill="#0f973d"/>
  <circle cx="39" cy="33" r="1.5" fill="#0f973d"/>
  <circle cx="25.7" cy="32.3" r="0.7" fill="#eafff1"/>
  <circle cx="39.7" cy="32.3" r="0.7" fill="#eafff1"/>

  <!-- nose -->
  <path d="M29.6 41.6 Q32 39.9 34.4 41.6 Q32 44 29.6 41.6 Z" fill="#111827"/>

  <!-- confident smirk -->
  <path d="M28.6 45.3 Q32 48 35.4 45.3" stroke="#111827" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>
