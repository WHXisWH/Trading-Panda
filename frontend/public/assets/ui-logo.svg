<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- tech HUD hexagon frame -->
  <polygon points="32,3 57,17.5 57,49.5 32,64 7,49.5 7,17.5" fill="none" stroke="#0f973d" stroke-width="1.4" opacity="0.4"/>
  <polygon points="32,8 52,19.5 52,47.5 32,59 12,47.5 12,19.5" fill="none" stroke="#0f973d" stroke-width="0.7" opacity="0.25"/>

  <!-- ears -->
  <circle cx="15" cy="17" r="8.5" fill="#111827"/>
  <circle cx="49" cy="17" r="8.5" fill="#111827"/>
  <circle cx="15" cy="17" r="3.4" fill="#0f973d" opacity="0.35"/>
  <circle cx="49" cy="17" r="3.4" fill="#0f973d" opacity="0.35"/>

  <!-- head -->
  <circle cx="32" cy="34" r="22" fill="#111827"/>

  <!-- wuxia headband ribbon tails -->
  <path d="M13 22 L5 25.5 L13 26 Z" fill="#0f973d"/>
  <path d="M51 22 L59 25.5 L51 26 Z" fill="#0f973d"/>
  <!-- wuxia headband (抹额) -->
  <rect x="11" y="20" width="42" height="6" rx="3" fill="#0b1220" stroke="#0f973d" stroke-width="0.8"/>
  <!-- forehead energy gem -->
  <path d="M32 18.6 L35 23 L32 27.4 L29 23 Z" fill="#0f973d"/>
  <circle cx="32" cy="23" r="1" fill="#eafff1"/>

  <!-- white face mask -->
  <ellipse cx="32" cy="39" rx="15.5" ry="13" fill="#f8f9fa"/>

  <!-- eye patches (angled, stern) -->
  <ellipse cx="24" cy="35" rx="5" ry="6.8" fill="#111827" transform="rotate(-23 24 35)"/>
  <ellipse cx="40" cy="35" rx="5" ry="6.8" fill="#111827" transform="rotate(23 40 35)"/>

  <!-- glowing green eyes -->
  <circle cx="25" cy="34" r="2.4" fill="#f8f9fa"/>
  <circle cx="39" cy="34" r="2.4" fill="#f8f9fa"/>
  <circle cx="25" cy="34" r="1.5" fill="#0f973d"/>
  <circle cx="39" cy="34" r="1.5" fill="#0f973d"/>
  <circle cx="25.6" cy="33.4" r="0.65" fill="#eafff1"/>
  <circle cx="39.6" cy="33.4" r="0.65" fill="#eafff1"/>

  <!-- nose -->
  <path d="M29.7 42.6 Q32 41 34.3 42.6 Q32 44.9 29.7 42.6 Z" fill="#111827"/>

  <!-- stern smirk -->
  <path d="M28.7 46.2 Q32 48.7 35.3 46.2" stroke="#111827" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>
