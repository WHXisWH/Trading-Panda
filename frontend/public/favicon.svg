<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Panda face base -->
  <circle cx="16" cy="16" r="15" fill="#111827"/>
  <!-- White face area -->
  <ellipse cx="16" cy="17.5" rx="10" ry="9" fill="#f8f9fa"/>
  <!-- Left eye patch -->
  <ellipse cx="11.5" cy="14" rx="3.5" ry="4" fill="#111827"/>
  <!-- Right eye patch -->
  <ellipse cx="20.5" cy="14" rx="3.5" ry="4" fill="#111827"/>
  <!-- Left eye highlight -->
  <circle cx="12.5" cy="13" r="1.3" fill="white"/>
  <!-- Right eye highlight -->
  <circle cx="21.5" cy="13" r="1.3" fill="white"/>
  <!-- Nose -->
  <ellipse cx="16" cy="18.5" rx="2.2" ry="1.6" fill="#111827"/>
  <!-- Mouth line -->
  <path d="M13.5 21 Q16 23.5 18.5 21" stroke="#111827" strokeWidth="0.9" fill="none" strokeLinecap="round"/>
  <!-- Left ear -->
  <circle cx="5.5" cy="7" r="4.5" fill="#111827"/>
  <!-- Right ear -->
  <circle cx="26.5" cy="7" r="4.5" fill="#111827"/>
  <!-- Green accent ring -->
  <circle cx="16" cy="16" r="15" stroke="#0f973d" strokeWidth="1" fill="none"/>
</svg>
