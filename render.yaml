services:
  - type: web
    name: trading-panda-market-monitor
    runtime: python
    rootDir: market-monitor
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: REDIS_URL
        sync: false
      - key: DEEPBOOK_DATABASE_URL
        value: ""
      - key: DEEPBOOK_SERVER_URL
        value: https://deepbook-indexer.mainnet.mystenlabs.com
      - key: DEEPBOOK_NETWORK
        value: mainnet
      - key: DEEPBOOK_POOLS
        value: ""
      - key: LAUNCH_PAIRS
        value: SUI_USDC,DEEP_USDC,WAL_USDC,NS_USDC
      - key: USE_PAIR_RANKING
        value: "true"
      - key: MAX_PUBLISH_PAIRS
        value: "4"
      - key: STALE_THRESHOLD_SEC
        value: "120"
      - key: SUI_RPC_URL
        value: https://fullnode.mainnet.sui.io:443
      - key: DEEPBOOK_PACKAGE_ID
        value: "0x2c8d603bc51326b8c13cef9dd07031a408a48dddb541963357661df5d3204809"
      - key: DEEPBOOK_POOL_MODULE
        value: pool
      - key: USE_SUI_RPC_FOR_POOLS
        value: "true"
      - key: USE_HTTP_GET_POOLS_FALLBACK
        value: "true"
      - key: USE_HTTP_POOL_DISCOVERY_PRIMARY
        value: "true"
      - key: POOL_RPC_LIMIT_PER_PAGE
        value: "50"
      - key: POOL_RPC_MAX_PAGES
        value: "20"
      - key: POLL_INTERVAL_SEC
        value: "15"
      - key: FILLS_POLL_LOOKBACK_SEC
        value: "259200"
      - key: FILLS_LOOKBACK_SEC
        value: "2592000"
      - key: CANDLE_PERIOD
        value: "1m"
      - key: OHLCV_LIMIT
        value: "60"
      - key: PRICE_SCALE
        value: "1000000000"
      - key: QTY_SCALE
        value: "1000000000"

  - type: web
    name: trading-panda-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: MARKET_MONITOR_URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: AGENT_TIMEOUT_SECONDS
        value: "3"
      - key: SUI_RPC_URL
        value: https://fullnode.testnet.sui.io:443
      - key: SUI_PRIVATE_KEY
        sync: false
      - key: SUI_WALLET_ADDRESS
        sync: false
      - key: PACKAGE_ID
        sync: false
      - key: PACKAGE_PUBLISHED_AT
        sync: false
      - key: REGISTRY_ID
        sync: false
      - key: ACHIEVEMENT_REGISTRY_ID
        sync: false
      - key: TRANSFER_POLICY_ID
        sync: false
      - key: WALRUS_PUBLISHER_URL
        value: https://publisher.walrus-testnet.walrus.space
      - key: WALRUS_AGGREGATOR_URL
        value: https://aggregator.walrus-testnet.walrus.space
      - key: JWT_SECRET
        sync: false
      - key: INTERNAL_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: MAX_ACTORS
        value: "100"
      - key: MERKLE_BATCH_SIZE
        value: "50"
      - key: MERKLE_SUBMIT_ENABLED
        value: "true"
      - key: SKILL_DIGEST_ENABLED
        value: "true"
      - key: ASYNC_JOB_WORKER_ENABLED
        value: "true"
      - key: ASYNC_JOB_POLL_INTERVAL_SEC
        value: "5"
      - key: ASYNC_JOB_BATCH_SIZE
        value: "10"
      - key: SKILL_RELOAD_TICK_INTERVAL
        value: "50"
      - key: AGENT_SIGNER_ADDRESS
        sync: false
      - key: AGENT_SIGNER_PRIVATE_KEY
        sync: false
      - key: CHAIN_PROOF_ENABLED
        value: "false"
      - key: DEBUG
        value: "false"
