services:
  - type: web
    name: trading-panda-market-monitor
    runtime: python
    rootDir: market-monitor
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: REDIS_URL
        sync: false
      - key: DEEPBOOK_DATABASE_URL
        sync: false
      - key: DEEPBOOK_SERVER_URL
        sync: false
      - key: DEEPBOOK_POOLS
        sync: false
      - key: SUI_RPC_URL
        value: https://fullnode.testnet.sui.io:443
      - key: DEEPBOOK_PACKAGE_ID
        value: "0xdee9"
      - key: DEEPBOOK_POOL_MODULE
        value: pool
      - key: USE_SUI_RPC_FOR_POOLS
        value: "true"
      - key: USE_HTTP_GET_POOLS_FALLBACK
        value: "true"
      - key: POOL_RPC_LIMIT_PER_PAGE
        value: "50"
      - key: POOL_RPC_MAX_PAGES
        value: "20"
      - key: POLL_INTERVAL_SEC
        value: "15"
      - key: FILLS_POLL_LOOKBACK_SEC
        value: "259200"
      - key: FILLS_LOOKBACK_SEC
        value: "2592000"

  - type: web
    name: trading-panda-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trading-panda-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SUI_RPC_URL
        value: https://fullnode.testnet.sui.io:443
      - key: SUI_PRIVATE_KEY
        sync: false
      - key: PACKAGE_ID
        sync: false
      - key: REGISTRY_ID
        sync: false
      - key: WALRUS_PUBLISHER_URL
        value: https://publisher.walrus-testnet.walrus.space
      - key: WALRUS_AGGREGATOR_URL
        value: https://aggregator.walrus-testnet.walrus.space
      - key: INTERNAL_SECRET
        sync: false
      - key: MAX_ACTORS
        value: "100"
      - key: MERKLE_BATCH_SIZE
        value: "50"

databases:
  - name: trading-panda-db
    plan: free
    databaseName: trading_panda
    postgresMajorVersion: "15"
