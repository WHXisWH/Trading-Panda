name = "trading-panda-ws"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "USER_HUB"
class_name = "UserHub"

[[migrations]]
tag = "v1"
new_classes = ["UserHub"]

[vars]
MAX_CONNECTIONS_PER_USER = "3"
MAX_CLIENT_MESSAGES_PER_SEC = "10"
MAX_OUTBOUND_QUEUE = "100"
HEARTBEAT_ALARM_SEC = "30"
